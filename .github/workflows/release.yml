name: Build Electron Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            command: npm run dist:mac:arm64
            artifact: macos-arm64
            files: |
              dist/*.dmg
              dist/*.zip
          - name: macOS Intel
            os: macos-15-intel
            command: npm run dist:mac:x64
            artifact: macos-x64
            files: |
              dist/*.dmg
              dist/*.zip
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win:x64
            artifact: windows-x64
            files: |
              dist/*.exe
              dist/*.zip
          - name: Linux x64
            os: ubuntu-latest
            command: npm run dist:linux:x64
            artifact: linux-x64
            files: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.21,<7"
      - name: Install Electron dependencies
        run: npm ci
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build desktop package
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Generate checksums
        run: sha256sum release-assets/*/* > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*/* SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --generate-notes --title "BrandScope ${GITHUB_REF_NAME}"
